services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: launchpilot
      POSTGRES_USER: launchpilot
      POSTGRES_PASSWORD: launchpilot-local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - launchpilot-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpilot -d launchpilot"]
      interval: 2s
      timeout: 3s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      # Local dev only. Production MUST enable security and the app MUST connect
      # with ELASTICSEARCH_API_KEY over TLS — see config._require_elasticsearch_security.
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - launchpilot-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_GRPC_PORT: 4317
    ports:
      - "6006:6006" # UI & OTLP HTTP endpoint (/v1/traces)
      - "4317:4317" # OTLP gRPC endpoint
    volumes:
      - launchpilot-phoenix:/root/.phoenix
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6006/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  launchpilot-postgres:
  launchpilot-elasticsearch:
  launchpilot-phoenix:
